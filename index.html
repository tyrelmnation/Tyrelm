    text: text,
    time: firebase.firestore.FieldValue.serverTimestamp()
  }).then(function() {
    inp.value = ''; inp.disabled = false;
  }).catch(function(e) { console.log('Reply error:', e); inp.disabled = false; });
}

// --- Delete comment ---
function deleteComment(id) {
  if (!confirm('Delete this comment?')) return;
  if (!FSDB) return;
  FSDB.collection('testimonials').doc(id).delete().catch(function(e) { console.log('Delete error:', e); });
}

// --- Real-time listener ---
function listenTestimonials() {
  if (_testUnsub) { _testUnsub(); _testUnsub = null; }
  const list = document.getElementById('testList');
  if (!FSDB) { return; }
  FSDB.collection('testimonials').orderBy('time', 'desc').limit(50).get().then(function(snap) {
  const countEl = document.getElementById('testCount');
  if (!FSDB) return;
  _testUnsub = FSDB.collection('testimonials').orderBy('time', 'desc').limit(50).onSnapshot(function(snap) {
    if (snap.empty) {
      list.innerHTML = '<div class="test-empty">No comments yet. Be the first to share!</div>';
      if (countEl) countEl.textContent = '';
      return;
    }
    countEl.textContent = snap.size + ' comment' + (snap.size!==1?'s':'');
    let html = '';
    snap.forEach(function(doc) {
      const d = doc.data();
      const initial = (d.name && d.name.length > 0) ? d.name.charAt(0).toUpperCase() : '?';
      const dateStr = d.time && d.time.toDate ? d.time.toDate().toLocaleDateString() : '';
      html += '<div class="test-item"><div class="test-item-header"><div class="test-avatar">' + initial + '</div><div class="test-name">' + escapeHtml(d.name) + '</div><div class="test-date">' + dateStr + '</div></div><div class="test-text">' + escapeHtml(d.text) + '</div></div>';
      const id = doc.id;
      const initial = d.name ? d.name.charAt(0).toUpperCase() : '?';
      const color = avatarColor(d.name||'');
      const timeStr = relTime(d.time);
      const liked = _isLiked(id) ? ' liked' : '';
      html += '<div class="test-item" id="ti-'+id+'">';
      html += '<button class="test-delete" onclick="deleteComment(\''+id+'\')" title="Delete">&#10005;</button>';
      html += '<div class="test-item-header"><div class="test-avatar" style="background:'+color+'">'+initial+'</div>';
      html += '<div class="test-name">'+escapeHtml(d.name||'Anonymous')+'</div><div class="test-date">'+timeStr+'</div></div>';
      html += '<div class="test-text">'+escapeHtml(d.text||'')+'</div>';
      html += '<div class="test-actions">';
      html += '<button class="test-like'+liked+'" onclick="toggleLike(\''+id+'\')"><svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg> <span id="lc-'+id+'">'+(d.likes||0)+'</span></button>';
      html += '<button class="test-reply-btn" onclick="toggleReplyForm(\''+id+'\')">Reply</button>';
      html += '</div>';
      html += '<div class="test-reply-form" id="rf-'+id+'"><input id="ri-'+id+'" placeholder="Write a reply..." maxlength="300"><button onclick="submitReply(\''+id+'\')">Reply</button></div>';
      html += '<div class="test-replies" id="tr-'+id+'"><div class="test-empty" style="padding:12px;font-size:12px;color:rgba(242,237,228,0.2);border-color:rgba(242,237,228,0.08)">Loading replies...</div></div>';
      html += '</div>';
    });
    list.innerHTML = html;
  }).catch(function(e) { console.log('Load error:', e); });
    // Load replies for each visible comment
    snap.forEach(function(doc) {
      loadReplies(doc.id);
    });
  }, function(e) { console.log('Listener error:', e); });
}

// --- Load replies ---
function loadReplies(commentId) {
  const el = document.getElementById('tr-'+commentId);
  if (!el || !FSDB) return;
  FSDB.collection('testimonials').doc(commentId).collection('replies').orderBy('time', 'asc').limit(20).get().then(function(snap) {
    if (snap.empty) { el.innerHTML = ''; return; }
    let html = '';
    snap.forEach(function(r) {
      const rd = r.data();
      html += '<div class="test-reply"><span class="test-reply-name">' + escapeHtml(rd.name||'Anonymous') + '</span><span class="test-reply-text">' + escapeHtml(rd.text||'') + '</span><span class="test-reply-date">' + relTime(rd.time) + '</span></div>';
    });
    el.innerHTML = html;
  }).catch(function(e) { console.log('Replies load error:', e); el.innerHTML = ''; });
}
